name: Release

# Publishes on version tags only, so every image in the registry corresponds
# to a release. Pull requests build without pushing (see ci.yml), which keeps
# a fork from ever publishing an image.
on:
  push:
    tags:
      - 'v*'
  # Manual runs are useful for re-publishing a tag after a registry outage.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v0.1.0-rc.1)'
        required: true

# No workflow-level env block for the image names: a top-level `env:` is
# evaluated outside any job and therefore cannot read environment-scoped
# secrets, which would silently leave the image name empty. The names are
# derived inside the jobs that hold `environment: prod`.

jobs:
  # Nothing is published unless the suite passes against a real Postgres.
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hookfan
          POSTGRES_PASSWORD: hookfan
          POSTGRES_DB: hookfan_test
        ports:
          - 5432:5432
        # The job must not start querying before the server accepts
        # connections.
        options: >-
          --health-cmd "pg_isready -U hookfan -d hookfan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would reformat these files:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://hookfan:hookfan@localhost:5432/hookfan_test?sslmode=disable
        run: go test ./... -count=1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build the UI
        working-directory: ui
        run: |
          npm ci
          npm run build

  publish:
    name: Publish ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-latest
    # Secrets resolve from this environment rather than the repository, and it
    # is where a required-reviewer rule is configured — with one set, no image
    # is pushed until a human approves the run.
    #
    # Environment secrets are still read as `secrets.NAME`; there is no
    # `env.prod.secrets.NAME` context.
    environment: prod
    permissions:
      contents: read
    strategy:
      # One registry failure should not abandon a half-published release; both
      # images are attempted, and the job as a whole still fails.
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            dockerfile: ./Dockerfile
          - name: ui
            context: ./ui
            dockerfile: ./ui/Dockerfile

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # metadata-action derives semver tags from github.ref, which on a
      # workflow_dispatch run is the BRANCH (refs/heads/master) regardless of
      # the tag typed into the input. That produced no version tag at all,
      # while type=raw still fired — so a manual run published only :latest.
      #
      # Normalising the ref here keeps checkout, the image tags, and the smoke
      # test all describing the same release.
      - name: Normalise the release ref
        id: ref
        run: |
          set -euo pipefail
          input="${{ github.event.inputs.tag }}"
          if [ -n "$input" ]; then
            ref="refs/tags/${input#refs/tags/}"
          else
            ref="${{ github.ref }}"
          fi

          case "$ref" in
            refs/tags/v*) ;;
            *)
              echo "::error::release must run from a v* tag; got '$ref'."
              echo "::error::On a manual run, enter an existing tag such as v0.1.0-rc.1."
              exit 1
              ;;
          esac

          tag="${ref#refs/tags/}"          # v0.1.0-rc.1
          echo "ref=$ref"     >> "$GITHUB_OUTPUT"
          echo "tag=$tag"     >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag (from $ref)"

      # Fail early and clearly: without these the login step's error is
      # cryptic, and a fork running this workflow has neither.
      - name: Check registry credentials
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be set on the 'prod' environment."
            echo "::error::Create an access token at https://hub.docker.com/settings/security, then add both"
            echo "::error::under Settings → Environments → prod → Environment secrets."
            exit 1
          fi

      # QEMU emulates the non-native architecture for the multi-platform build.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/hookfan-${{ matrix.name }}
          # Every pattern carries an explicit value= from the normalised tag.
          # Without it these read github.ref, which on a manual run is the
          # branch — producing no version tag while :latest still fired.
          #
          # metadata-action already suppresses {{major}}.{{minor}} and
          # {{major}} for a prerelease (it emits the full version instead), so
          # v0.1.0-rc.1 yields exactly one tag: 0.1.0-rc.1.
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ref.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ref.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.ref.outputs.tag }},enable=${{ !startsWith(steps.ref.outputs.tag, 'v0.') }}
            # :latest only for a final release — never a release candidate.
            type=raw,value=latest,enable=${{ !contains(steps.ref.outputs.tag, '-') }}
          labels: |
            org.opencontainers.image.title=hookfan-${{ matrix.name }}
            org.opencontainers.image.description=Self-hosted webhook fan-out gateway (${{ matrix.name }})
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers in the registry so a re-run does not rebuild from
          # scratch. mode=max also caches intermediate build stages.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false

      # A push that produced no digest has not published anything. Without this
      # the job goes green and the smoke test fails later with "manifest
      # unknown", which points at the wrong place.
      - name: Confirm the push produced a digest
        run: |
          digest="${{ steps.push.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "::error::build-push-action returned no digest for hookfan-${{ matrix.name }} — nothing was published."
            exit 1
          fi
          echo "hookfan-${{ matrix.name }} → $digest"

      # Read it back from the registry rather than trusting the push output, so
      # the smoke test can only ever run against an image that is really there.
      # `|| exit 1` after the loop: a `while` in a pipeline runs in a subshell,
      # so an `exit` inside it would not fail the step on its own.
      - name: Verify each tag is pullable
        run: |
          set -uo pipefail
          failed=0
          while read -r tag; do
            [ -n "$tag" ] || continue
            if docker buildx imagetools inspect "$tag" >/dev/null 2>&1; then
              echo "  ✓ $tag"
            else
              echo "::error::$tag was pushed but cannot be read back from the registry"
              failed=1
            fi
          done <<< "${{ steps.meta.outputs.tags }}"
          [ "$failed" = "0" ] || exit 1

      - name: Summarise
        run: |
          {
            echo "### hookfan-${{ matrix.name }} published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
            echo "Platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"

  # Confirms the published images actually run, rather than assuming a
  # successful push means a working image.
  smoke-test:
    name: Smoke test published images
    needs: publish
    runs-on: ubuntu-latest
    # Also needed here: the image names are built from DOCKERHUB_USERNAME,
    # which now lives in this environment rather than the repository.
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Derived the same way as in publish, so the two can never disagree about
      # which release is under test.
      - name: Resolve the version tag
        id: version
        run: |
          set -euo pipefail
          input="${{ github.event.inputs.tag }}"
          tag="${input:-${{ github.ref_name }}}"
          tag="${tag#refs/tags/}"
          case "$tag" in
            v*) ;;
            *) echo "::error::expected a v* tag, got '$tag'"; exit 1 ;;
          esac
          echo "value=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Smoke testing ${tag#v}"

      # Log in before pulling: an anonymous pull is rate-limited per IP, and a
      # shared runner burns that budget quickly.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The registry is eventually consistent: a manifest can take a few seconds
      # to become pullable after a push. Waiting here — and saying plainly what
      # is missing — beats `docker run` failing with a bare "manifest unknown".
      #
      # Queried over the registry HTTP API rather than `docker manifest
      # inspect`, which can block indefinitely when it hits a rate limit.
      - name: Wait for the images to be pullable
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -uo pipefail
          version="${{ steps.version.outputs.value }}"
          accept='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json'

          probe() {
            repo="$1"; tag="$2"
            token="$(curl -s --max-time 20 -u "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN" \
              "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repo}:pull" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("token",""))' 2>/dev/null)"
            curl -s --max-time 20 -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $token" -H "Accept: $accept" \
              "https://registry-1.docker.io/v2/${repo}/manifests/${tag}"
          }

          for name in api ui; do
            repo="$DOCKERHUB_USERNAME/hookfan-$name"
            found=""
            for attempt in $(seq 1 12); do
              code="$(probe "$repo" "$version")"
              if [ "$code" = "200" ]; then
                echo "  ✓ $repo:$version is in the registry (attempt $attempt)"
                found=1
                break
              fi
              echo "  … $repo:$version → HTTP $code, retrying"
              sleep 5
            done
            if [ -z "$found" ]; then
              echo "::error::$repo:$version is not in the registry after 60s."
              echo "::error::The publish job reported success without publishing it."
              echo "::error::Check its 'Confirm the push produced a digest' and"
              echo "::error::'Verify each tag is pullable' steps. Note that a prerelease"
              echo "::error::only ever receives the full version tag (0.1.0-rc.1) —"
              echo "::error::metadata-action suppresses {{major}}.{{minor}} and :latest."
              exit 1
            fi
          done

      - name: Start Postgres
        run: |
          docker run -d --name pg --network host \
            -e POSTGRES_USER=hookfan -e POSTGRES_PASSWORD=hookfan -e POSTGRES_DB=hookfan \
            postgres:16-alpine
          for _ in $(seq 1 30); do
            docker exec pg pg_isready -U hookfan -d hookfan >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Run the published API image
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL='postgres://hookfan:hookfan@localhost:5432/hookfan?sslmode=disable' \
            -e ADMIN_TOKEN="$(openssl rand -base64 32)" \
            -e SECRET_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e PORT=8081 \
            "${{ secrets.DOCKERHUB_USERNAME }}/hookfan-api:${{ steps.version.outputs.value }}"

          for _ in $(seq 1 30); do
            curl -sf http://localhost:8081/healthz >/dev/null && break
            sleep 1
          done

      - name: Assert the API is healthy and migrated
        run: |
          echo "healthz: $(curl -sf http://localhost:8081/healthz)"
          # /readyz proves migrations ran and the database is reachable.
          readyz="$(curl -sf http://localhost:8081/readyz)" || {
            echo "::error::/readyz did not return success"
            docker logs api
            exit 1
          }
          echo "readyz: $readyz"
          echo "$readyz" | grep -q '"database":"ok"' || {
            echo "::error::database check failed"
            docker logs api
            exit 1
          }

      - name: Run the published UI image
        run: |
          docker run -d --name ui --network host \
            -e API_BASE_URL=http://localhost:8081 \
            "${{ secrets.DOCKERHUB_USERNAME }}/hookfan-ui:${{ steps.version.outputs.value }}"
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz >/dev/null && break
            sleep 1
          done

      - name: Assert the UI serves and resolves its runtime config
        run: |
          curl -sf http://localhost:8080/ | grep -q '<div id="root">' || {
            echo "::error::the UI did not serve index.html"
            docker logs ui
            exit 1
          }
          # config.js is generated at container start, not baked at build time.
          config="$(curl -sf http://localhost:8080/config.js)"
          echo "config.js: $config"
          echo "$config" | grep -q 'http://localhost:8081' || {
            echo "::error::config.js did not pick up API_BASE_URL"
            exit 1
          }
          # A client-side route must fall back to index.html on refresh.
          code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/events)"
          [ "$code" = "200" ] || { echo "::error::SPA fallback returned $code"; exit 1; }

      - name: Container logs on failure
        if: failure()
        run: |
          echo "=== api ==="; docker logs api 2>&1 | tail -50
          echo "=== ui ===";  docker logs ui  2>&1 | tail -50
