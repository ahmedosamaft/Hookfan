server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Generated at container start by entrypoint.sh. Never cached: it carries
    # the API address, and a stale copy would point the app at the wrong host
    # after a redeploy.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
        try_files /config.js =404;
    }

    # Hashed asset filenames change on every build, so they can be cached hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: client-side routes such as /events have no file on disk, so
    # a refresh there must still serve the app rather than 404.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The app makes no cross-origin requests other than to the API, and frames
    # nothing.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
}
